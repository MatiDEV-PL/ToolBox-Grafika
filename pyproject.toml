[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbox"
version = "0.1.0"
description = "Biblioteka narzedzi geometrycznych"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["testy"]
