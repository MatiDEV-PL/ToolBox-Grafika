[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbox"
dynamic = ["version"]
description = "Biblioteka narzedzi geometrycznych"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "numpy"]

[tool.setuptools.dynamic]
version = { attr = "toolbox._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["testy"]
pythonpath = ["src"]
# Czytelne wyjście w terminalu: kolor gdy obslugiwany, krotkie tracebacki
# i -s, zeby print() z testow trafialy na ekran
addopts = "-v --color=auto --tb=short -s"
console_output_style = "count"
